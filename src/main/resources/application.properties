spring.application.name=recommendation-service

# ==========================================
# 1. ???????? ?? (H2) - ?????? ????????????? (@Primary)
# ==========================================
spring.datasource.url=jdbc:h2:file:D:/Java/HW-3-BD/transaction;ACCESS_MODE_DATA=r
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# 2. ?????? ?? (PostgreSQL) - ???????????? ???????
# ==========================================
spring.rules-datasource.url=jdbc:postgresql://localhost:5432/rules_db
spring.rules-datasource.driver-class-name=org.postgresql.Driver
spring.rules-datasource.username=postgres
spring.rules-datasource.password=postgres

# ==========================================
# 3. Liquibase
# ==========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=${spring.rules-datasource.url}
spring.liquibase.user=${spring.rules-datasource.username}
spring.liquibase.password=${spring.rules-datasource.password}
spring.liquibase.default-schema=public